services:
  sql:
    image: mcr.microsoft.com/azure-sql-edge
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: "Password@1"
      MSSQL_PID: "Developer"
      MSSQL_TCP_PORT: "1433"
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "1434:1433"
    volumes:
      - sql-data:/var/opt/mssql
  redis:
      image: redis:latest
      ports:
        - "6379:6379"
      volumes:
        - redis-data:/data

volumes:
  redis-data:
  sql-data: